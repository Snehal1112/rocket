  <title>Rocket SVG Illustrations Preview</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Inter", "Segoe UI", system-ui, sans-serif; transition: background 0.3s, color 0.3s; }
    body.light { background: #f5f7fa; color: #1e293b; }
    body.dark  { background: #1e1e1e; color: #dedede; }
    body.light {
      --color-primary: hsl(213, 88%, 42%); --color-primary-foreground: hsl(0, 0%, 100%);
      --color-background: hsl(214, 44%, 98%); --color-foreground: hsl(222, 47%, 11%);
      --color-muted: hsl(213, 35%, 94%); --color-muted-foreground: hsl(215, 17%, 40%);
      --color-accent: hsl(212, 86%, 94%); --color-destructive: hsl(0, 84%, 60%);
      --color-destructive-foreground: hsl(0, 0%, 98%); --color-border: hsl(214, 31%, 88%);
    }
    body.dark {
      --color-primary: hsl(207, 100%, 42%); --color-primary-foreground: hsl(0, 0%, 98%);
      --color-background: hsl(0, 0%, 12%); --color-foreground: hsl(0, 0%, 87%);
      --color-muted: hsl(0, 0%, 14%); --color-muted-foreground: hsl(0, 0%, 60%);
      --color-accent: hsl(204, 100%, 18%); --color-destructive: hsl(0, 72%, 45%);
      --color-destructive-foreground: hsl(0, 0%, 98%); --color-border: hsl(0, 0%, 19%);
    }
    header { padding: 24px 32px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--color-border); }
    header h1 { font-size: 20px; font-weight: 600; }
    header span { font-size: 13px; opacity: 0.6; margin-left: 8px; }
    .toggle-btn { cursor: pointer; padding: 8px 16px; border-radius: 8px; border: 1px solid var(--color-border); background: var(--color-muted); color: var(--color-foreground); font-size: 13px; font-weight: 500; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; padding: 28px; }
    .card { border: 1px solid var(--color-border); border-radius: 12px; overflow: hidden; background: var(--color-background); }
    .card .preview { display: flex; align-items: center; justify-content: center; padding: 20px; min-height: 200px; }
    .card .preview svg { width: 160px; height: 160px; }
    .card .info { padding: 10px 14px; border-top: 1px solid var(--color-border); }
    .card .info h3 { font-size: 13px; font-weight: 600; }
    .card .info p { font-size: 11px; margin-top: 3px; opacity: 0.6; }
    .card .info code { font-size: 10px; background: var(--color-muted); padding: 2px 5px; border-radius: 4px; display: inline-block; margin-top: 5px; }
  </style>
</head>
