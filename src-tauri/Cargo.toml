[package]
name = "rocket"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix avoids name collision between the lib and bin on Windows.
name = "rocket_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Internal workspace crates
rocket-shared.workspace = true
rocket-collection.workspace = true
rocket-environment.workspace = true
rocket-http.workspace = true
rocket-history.workspace = true
rocket-app.workspace = true
rocket-infra.workspace = true

# Tauri
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"

# Shared workspace deps
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
log.workspace = true
env_logger.workspace = true
dirs.workspace = true
uuid.workspace = true
reqwest.workspace = true
url = "2"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"
