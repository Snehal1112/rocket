[package]
name = "rocket"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix avoids name collision between the lib and bin on Windows.
name = "rocket_lib"
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Internal workspace crates
rocket-shared.workspace = true
rocket-collection.workspace = true
rocket-environment.workspace = true
rocket-http.workspace = true
rocket-history.workspace = true
rocket-app.workspace = true
rocket-audit.workspace = true
rocket-git.workspace = true
rocket-infra.workspace = true
rocket-scripting.workspace = true
rocket-workspace.workspace = true
rocket-import.workspace = true

# Tauri
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-fs = "2.5"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-os = "2"

# Shared workspace deps
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-log.workspace = true
dirs.workspace = true
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
git2 = { version = "0.19", features = ["ssh"] }
uuid.workspace = true
reqwest.workspace = true
url = "2"
chrono.workspace = true
ulid.workspace = true
base64.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"

[dev-dependencies]
tempfile = "3"
