[package]
name = "rocket"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix avoids name collision between the lib and bin on Windows.
name = "rocket_lib"
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Internal workspace crates
rocket-shared.workspace = true
rocket-acp.workspace = true
rocket-collection.workspace = true
rocket-grpc.workspace = true
rocket-environment.workspace = true
rocket-http.workspace = true
rocket-history.workspace = true
rocket-app.workspace = true
rocket-audit.workspace = true
rocket-flow.workspace = true
rocket-git.workspace = true
rocket-infra.workspace = true
rocket-scripting.workspace = true
rocket-workspace.workspace = true
rocket-import.workspace = true

# Tauri
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-fs = "2.5"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-os = "2"

# Shared workspace deps
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
tokio.workspace = true
async-trait.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-log.workspace = true
dirs.workspace = true
keyring.workspace = true
git2 = { version = "0.21", features = ["ssh", "https"] }
uuid.workspace = true
reqwest.workspace = true
url = "2"
chrono.workspace = true
ulid.workspace = true
base64.workspace = true
tauri-plugin-clipboard-manager = "2"

# MCP tool server (Plan 04) — official MCP SDK + the HTTP server crate it
# integrates with. Not workspace-shared: no other crate in this workspace
# needs either of these (rocket-infra maps McpServerSpec to the
# agent-client-protocol crate's own McpServer type, never to rmcp, so
# rocket-infra/Cargo.toml deliberately has no rmcp/axum entry).
#
# Feature list is the union of what this plan's HTTP server needs (server,
# macros, transport-streamable-http-server) and what Plan 05's stdio bridge
# needs (transport-io, client, transport-streamable-http-client-reqwest) —
# both transports are declared here, in this one line, so Plan 05 does not
# add a second, conflicting `rmcp = { ... }` entry to this same file.
rmcp = { version = "3.5.0", features = [
    "server",
    "macros",
    "transport-streamable-http-server",
    "transport-io",
    "client",
    "transport-streamable-http-client-reqwest",
] }
axum = "0.8"
schemars = "1"
subtle = "2"
# CancellationToken for MCP server shutdown. Already in the lockfile via
# rmcp, which takes the same token type in StreamableHttpServerConfig.
tokio-util = "0.7"
# rmcp's HTTP client (used by the stdio bridge, Plan 05) is reqwest-backed.
# That reqwest build has rustls with no crypto provider (tauri-plugin-updater
# enables "rustls-no-provider"), so building a client panics unless a
# process-wide provider is installed first. Moved here from
# [dev-dependencies] (Plan 04 only needed it in its own integration test) —
# run_stdio_bridge needs the same provider in the production binary. "ring"
# is already in the lockfile.
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[target.'cfg(target_os = "linux")'.dependencies]
# v2_34 exposes MemoryPressureSettings; wry already enables it transitively.
webkit2gtk = { version = "2.0", features = ["v2_34"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
tauri = { version = "2", features = ["test"] }
async-trait.workspace = true
