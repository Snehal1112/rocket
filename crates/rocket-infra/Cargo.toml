[package]
name = "rocket-infra"
version.workspace = true
edition.workspace = true

[dependencies]
# WebSocket client. `native-tls` matches reqwest's TLS backend, so HTTP and WebSocket trust the
# same OS certificate store. `native-tls` itself is needed to build the permissive connector used
# when a request turns certificate verification off.
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "native-tls"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
native-tls = "0.2"
rocket-shared.workspace = true
rocket-audit.workspace = true
rocket-collection.workspace = true
rocket-environment.workspace = true
rocket-acp.workspace = true
rocket-flow.workspace = true
rocket-grpc = { path = "../rocket-grpc" }
prost = "0.14"
tokio-stream = "0.1"
prost-reflect = { version = "0.16", features = ["serde"] }
prost-types = "0.14"
tonic = { version = "0.14.6", default-features = false, features = ["codegen", "channel", "tls-ring", "tls-native-roots"] }
rocket-http.workspace = true
rocket-history.workspace = true
rocket-workspace.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
async-trait.workspace = true
tokio.workspace = true
reqwest.workspace = true
notify.workspace = true
dirs.workspace = true
sha2.workspace = true
base64.workspace = true
tracing.workspace = true
uuid.workspace = true
chrono.workspace = true
ulid.workspace = true
dashmap = { workspace = true }
rocket-scripting.workspace = true
deno_core = "0.400.0"
deno_error = "=0.7.1"
thiserror.workspace = true
url = "2"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
keyring.workspace = true
# Decrypts `BEGIN ENCRYPTED PRIVATE KEY` client keys in memory. `3des` and `sha1-insecure` are
# only for reading old keys the user already has, never for writing.
pkcs8 = { version = "0.10", features = ["encryption", "pem", "std", "3des", "sha1-insecure"] }
zeroize = "1"
# The one-time PKCS12 export password comes from the OS random generator.
rand = "0.8"
agent-client-protocol = "2.2"
async-process = "2"
futures-lite = "2"
mime_guess = "2"

[[bin]]
name = "test_acp_agent"
path = "src/bin/test_acp_agent.rs"
test = false
doc = false

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = ["std", "process"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
futures-util = "0.3"
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring", "pem"] }
tonic = { version = "0.14.6", default-features = false, features = ["codegen", "channel", "server", "router", "tls-ring"] }
tonic-reflection = { version = "0.14.6", default-features = false, features = ["server"] }
tokio-stream = { version = "0.1", features = ["net"] }
