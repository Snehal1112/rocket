[package]
name = "rocket-infra"
version.workspace = true
edition.workspace = true

[dependencies]
rocket-shared.workspace = true
rocket-audit.workspace = true
rocket-collection.workspace = true
rocket-environment.workspace = true
rocket-acp.workspace = true
rocket-flow.workspace = true
rocket-http.workspace = true
rocket-history.workspace = true
rocket-workspace.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
async-trait.workspace = true
tokio.workspace = true
reqwest.workspace = true
notify.workspace = true
dirs.workspace = true
sha2.workspace = true
base64.workspace = true
tracing.workspace = true
uuid.workspace = true
chrono.workspace = true
ulid.workspace = true
dashmap = { workspace = true }
rocket-scripting.workspace = true
deno_core = "0.400.0"
deno_error = "=0.7.1"
thiserror.workspace = true
url = "2"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
keyring.workspace = true
agent-client-protocol = "2.2"
async-process = "2"
futures-lite = "2"

[[bin]]
name = "test_acp_agent"
path = "src/bin/test_acp_agent.rs"
test = false
doc = false

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = ["std", "process"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
