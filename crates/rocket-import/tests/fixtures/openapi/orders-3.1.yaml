openapi: 3.1.0
info:
  title: Orders
  version: 1.2.0
servers:
  - url: https://api.example.com/v1
paths:
  /orders:
    get:
      operationId: listOrders
      summary: List orders
      tags: [Order Management]
      parameters:
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: ok
    post:
      operationId: createOrder
      summary: Create an order
      tags: [Order Management]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                sku: { type: string }
      responses:
        '201':
          description: created
components:
  parameters:
    Page:
      name: page
      in: query
      required: true
      schema: { type: integer }
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Key
