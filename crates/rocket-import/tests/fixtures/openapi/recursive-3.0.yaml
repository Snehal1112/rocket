openapi: 3.0.3
info:
  title: Tree
  version: 1.0.0
servers:
  - url: https://api.example.com
paths:
  /nodes:
    post:
      operationId: createNode
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Node'
      responses:
        '201':
          description: created
components:
  schemas:
    Node:
      type: object
      properties:
        name: { type: string }
        children:
          type: array
          items:
            $ref: '#/components/schemas/Node'
