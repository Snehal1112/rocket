<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

      name="description"

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Rocket Manual" />
    <meta
      property="og:description"
      content="How to use Rocket — collections, Flow, the AI Assistant, secrets, and every feature in between."
    />
    <meta property="og:image" content="/rocket.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Rocket Manual</title>
    <script>
      // Settle the theme before the first paint, so there is no flash of the wrong palette.
      // ThemeToggle writes the same key.
      try {
        var stored = localStorage.getItem('rocket-theme');
        var dark = stored
          ? stored === 'dark'
          : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.classList.toggle('dark', dark);
      } catch (error) {
        /* Storage can be blocked. The light palette is a fine default. */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
