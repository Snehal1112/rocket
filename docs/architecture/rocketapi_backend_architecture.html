<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>RocketAPI Backend Architecture</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #fafaf8;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px;
    min-height: 100vh;
  }
  h1 { font-size: 18px; font-weight: 500; color: #2c2c2a; margin-bottom: 6px; }
  .meta { font-size: 13px; color: #5f5e5a; margin-bottom: 32px; }
  .card {
    background: #fff;
    border: 1px solid rgba(0,0,0,0.1);
    border-radius: 16px;
    padding: 32px;
    max-width: 780px;
    width: 100%;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }

  /* ── color ramps (light) ──────────────────────────── */
  .c-blue   > rect, .c-blue   > circle, .c-blue   > ellipse { fill: #E6F1FB; stroke: #185FA5; }
  .c-purple > rect, .c-purple > circle, .c-purple > ellipse { fill: #EEEDFE; stroke: #534AB7; }
  .c-teal   > rect, .c-teal   > circle, .c-teal   > ellipse { fill: #E1F5EE; stroke: #0F6E56; }
  .c-coral  > rect, .c-coral  > circle, .c-coral  > ellipse { fill: #FAECE7; stroke: #993C1D; }
  .c-amber  > rect, .c-amber  > circle, .c-amber  > ellipse { fill: #FAEEDA; stroke: #854F0B; }
  .c-gray   > rect, .c-gray   > circle, .c-gray   > ellipse { fill: #F1EFE8; stroke: #5F5E5A; }

  .box { fill: #F5F4F0; stroke: rgba(0,0,0,0.13); }

  /* ── text on colored fills (light) ───────────────── */
  .c-blue   > text.th { fill: #0C447C; } .c-blue   > text.ts { fill: #185FA5; }
  .c-purple > text.th { fill: #3C3489; } .c-purple > text.ts { fill: #534AB7; }
  .c-teal   > text.th { fill: #085041; } .c-teal   > text.ts { fill: #0F6E56; }
  .c-coral  > text.th { fill: #712B13; } .c-coral  > text.ts { fill: #993C1D; }
  .c-amber  > text.th { fill: #633806; } .c-amber  > text.ts { fill: #854F0B; }
  .c-gray   > text.th { fill: #2C2C2A; } .c-gray   > text.ts { fill: #5F5E5A; }

  /* ── base text ────────────────────────────────────── */
  text.th {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 14px; font-weight: 500; fill: #2c2c2a;
  }
  text.ts {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 12px; font-weight: 400; fill: #5f5e5a;
  }

  line.arr-line { stroke: #888780; stroke-width: 1.5; }
  line.sep      { stroke: rgba(0,0,0,0.12); stroke-width: 0.5; }

  /* ── dark mode ────────────────────────────────────── */
  @media (prefers-color-scheme: dark) {
    body  { background: #1a1a18; }
    h1    { color: #e5e4dc; }
    .meta { color: #9c9a92; }
    .card { background: #242422; border-color: rgba(255,255,255,0.1); box-shadow: none; }

    .c-blue   > rect, .c-blue   > circle, .c-blue   > ellipse { fill: #042C53; stroke: #85B7EB; }
    .c-purple > rect, .c-purple > circle, .c-purple > ellipse { fill: #26215C; stroke: #AFA9EC; }
    .c-teal   > rect, .c-teal   > circle, .c-teal   > ellipse { fill: #04342C; stroke: #5DCAA5; }
    .c-coral  > rect, .c-coral  > circle, .c-coral  > ellipse { fill: #4A1B0C; stroke: #F0997B; }
    .c-amber  > rect, .c-amber  > circle, .c-amber  > ellipse { fill: #412402; stroke: #EF9F27; }
    .c-gray   > rect, .c-gray   > circle, .c-gray   > ellipse { fill: #2C2C2A; stroke: #B4B2A9; }

    .box { fill: #2e2e2c; stroke: rgba(255,255,255,0.12); }

    .c-blue   > text.th { fill: #B5D4F4; } .c-blue   > text.ts { fill: #85B7EB; }
    .c-purple > text.th { fill: #CECBF6; } .c-purple > text.ts { fill: #AFA9EC; }
    .c-teal   > text.th { fill: #9FE1CB; } .c-teal   > text.ts { fill: #5DCAA5; }
    .c-coral  > text.th { fill: #F5C4B3; } .c-coral  > text.ts { fill: #F0997B; }
    .c-amber  > text.th { fill: #FAC775; } .c-amber  > text.ts { fill: #EF9F27; }
    .c-gray   > text.th { fill: #D3D1C7; } .c-gray   > text.ts { fill: #B4B2A9; }

    text.th { fill: #e5e4dc; }
    text.ts { fill: #9c9a92; }
    line.arr-line { stroke: #9c9a92; }
    line.sep      { stroke: rgba(255,255,255,0.12); }
  }
</style>
</head>
